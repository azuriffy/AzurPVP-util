# AzurPvP Utils — signature colours: purple and black
prefix: "&8[&5&lAzur&dPvP&8] &r"
colors:
  primary: "#7028D8"
  secondary: "#17131F"
combat:
  enabled: true
  tag-seconds: 15
  prevent-commands: true
  blocked-commands: [spawn, home, tpa, tpaccept, warp]
  punish-logout: true
  punishment: "KILL"
  bossbar: true
pvp:
  modern-mechanics: true
  custom-knockback: false
  horizontal-knockback: 0.40
  vertical-knockback: 0.36
kits:
  starter:
    cooldown-seconds: 30
    items:
      - "IRON_SWORD"
      - "COOKED_BEEF:16"
spawn:
  world: ""
  x: 0.5
  y: 80
  z: 0.5
  yaw: 0
  pitch: 0
messages:
  rules: "&dBe respectful. No cheating, exploiting, or harassment. Follow staff instructions."
  discord: "&dDiscord: &fSet your invite in config.yml"
  report-channel: ""
  discord-webhook: ""
database:
  file: "players.db"

# Role data is stored separately in roles.yml.
# First-run bootstrap assigns the first online operator the permanent dev role.
# The built-in dev role cannot be deleted. Dev can manage roles with /role.
maintenance:
  enabled: false
features:
  combat: true
  kits: true
  arenas: true
  duels: true
  stats: true
  spawn: true
  parties: false
  clans: false
  friends: false
  chat-moderation: false
  staff-tools: true
  anticheat: false
  scoreboard: false
  tablist: false
  cosmetics: false
  quests: false
  seasons: false
  economy: false
