name: Build AzurPvP Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Plugin
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project files
        run: |
          test -f pom.xml || { echo 'ERROR: pom.xml must be in the repository root.'; exit 1; }
          test -d src/main/java || { echo 'ERROR: src/main/java folder is missing.'; exit 1; }

      - name: Build plugin with Maven
        run: mvn --batch-mode --no-transfer-progress -e clean package

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AzurPvP-Utils-1.0.0
          path: target/AzurPvP-Utils-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
