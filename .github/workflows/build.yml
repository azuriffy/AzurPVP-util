name: Build AzurPvP Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: AzurPvP-Utils-1.0.0
          path: target/AzurPvP-Utils-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
